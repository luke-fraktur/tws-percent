plugins { id 'com.android.application' }

def signingStoreFile = System.getenv('TWS_SIGNING_STORE_FILE')
def signingStorePassword = System.getenv('TWS_SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('TWS_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('TWS_SIGNING_KEY_PASSWORD')
def hasReleaseSigning = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it != null && !it.isBlank() }

android {
    namespace 'com.luke.earbudswidget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luke.earbudswidget'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.2.3'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
